# 비밀번호 변경 방법
# 1) 저장소 Settings → Secrets and variables → Actions → EDIT_PASSWORD 를 새 비밀번호로 Update
# 2) Actions 탭 → "비밀번호 적용" → Run workflow
# 수정용 열쇠까지 바꾸려면(비밀번호 유출 시 권장) EDIT_TOKEN 도 새 토큰으로 Update 후 실행
name: 비밀번호 적용

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 수정용 열쇠를 비밀번호로 암호화
        env:
          EDIT_TOKEN: ${{ secrets.EDIT_TOKEN }}
          EDIT_PASSWORD: ${{ secrets.EDIT_PASSWORD }}
        run: node .github/scripts/encrypt-auth.mjs
      - name: 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auth.json
          git commit -m "비밀번호 적용 (수정 잠금 갱신)" || echo "변경 없음"
          git push
